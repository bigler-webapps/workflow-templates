name: App CI

on:
  workflow_call:
    inputs:
      # Backend
      dockerfile:
        type: string
        default: 'backend/Dockerfile'
      build-context:
        type: string
        default: '.'
      backend-target:
        description: >
          Optional Dockerfile build --target for the backend CI image. Default ''
          builds the full production image (current behaviour, backward-compatible).
          A repo opts in with 'backend_test' once its backend/Dockerfile splits into
          backend_base -> backend_test -> final stages (see CI-6): skips the
          frontend build + collectstatic for a pytest-only image. Only opt in after
          confirming no backend test depends on the frontend static/templates/index.html.
        type: string
        default: ''
      db-image:
        type: string
        default: 'postgis/postgis:14-3.1'
      django-settings-module:
        type: string
        default: 'backend.test_settings'
      pytest-args:
        type: string
        default: ''
      pytest-import-mode:
        description: >
          pytest --import-mode value. Default 'importlib' avoids basename
          collisions (e.g. multiple tests.py modules). Use 'prepend' only
          if a specific repo's test layout requires it.
        type: string
        default: 'importlib'
      run-backend:
        type: boolean
        # Temporarily disabled by default to save GH Actions minutes. Callers
        # that want backend CI must opt in with `run-backend: true`. Flip back
        # to true when budget allows.
        default: false
      run-security:
        type: boolean
        default: true
      # Frontend
      node-version:
        type: string
        default: '24'
      pnpm-version:
        type: string
        default: '10.11.0'
      frontend-path:
        type: string
        default: 'frontend'
      run-frontend-lint:
        type: boolean
        default: true
      run-frontend-tests:
        type: boolean
        # Temporarily disabled by default to save GH Actions minutes. Lint
        # stays on. Callers that want test runs must opt in with
        # `run-frontend-tests: true`. Flip back to true when budget allows.
        default: false
      runs-on:
        description: >
          Runner label. Use 'ubuntu-latest' for GitHub-hosted runners (default).
          For the self-hosted Netcup pool pass a single unique label (e.g. 'netcup').
          Multi-label JSON arrays are not supported by this input.
        type: string
        default: 'ubuntu-latest'
    secrets:
      VITE_APP_MUI_LICENSE_KEY:
        required: false
      HRAM_ENGINE_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  backend:
    if: ${{ inputs.run-backend }}
    runs-on: ${{ inputs.runs-on }}
    env:
      # Unique per-run tag: the self-hosted runner's Docker daemon is shared by
      # 3 slots across ALL repos -- a fixed tag races between concurrent backend
      # jobs and executes the WRONG repo's tests.
      CI_IMAGE: ci-backend:${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: ${{ inputs.db-image }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          # Dynamic host port (NOT 5432:5432): self-hosted runners run multiple
          # jobs on ONE host, so a fixed host port collides ("port already
          # allocated"). GitHub maps a random free host port, read below via
          # job.services.postgres.ports['5432'].
          - 5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Clean stale Python byte-code
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Build backend image
        # Host-daemon BuildKit (CI-6/Grund B): the persistent self-hosted runner's
        # Docker daemon already keeps a layer cache across jobs (GC-capped via the
        # daily `docker buildx prune --keep-storage=20GB`), so a plain `docker build`
        # gets incremental warm builds for free. This drops setup-buildx-action's
        # docker-container driver (a separate cache namespace, not the daemon's) and
        # the remote `type=gha` cache export/import (slow, LRU-evicted under
        # multi-repo load) -- both no longer needed. `--target` stays empty by
        # default (full image, current behaviour); a repo opts into a leaner
        # pytest-only image via `backend-target: backend_test` (CI-6/Grund A).
        env:
          HRAM_ENGINE_READ_TOKEN: ${{ secrets.HRAM_ENGINE_READ_TOKEN }}
          VITE_APP_MUI_LICENSE_KEY: ${{ secrets.VITE_APP_MUI_LICENSE_KEY }}
          BACKEND_TARGET: ${{ inputs.backend-target }}
          BACKEND_DOCKERFILE: ${{ inputs.dockerfile }}
          BACKEND_BUILD_CONTEXT: ${{ inputs.build-context }}
        run: |
          set -euo pipefail
          target_args=()
          if [ -n "$BACKEND_TARGET" ]; then
            target_args=(--target "$BACKEND_TARGET")
          fi
          DOCKER_BUILDKIT=1 docker build \
            "${target_args[@]}" \
            --build-arg "VITE_APP_MUI_LICENSE_KEY=$VITE_APP_MUI_LICENSE_KEY" \
            --secret id=hram_engine_token,env=HRAM_ENGINE_READ_TOKEN \
            -t "$CI_IMAGE" \
            -f "$BACKEND_DOCKERFILE" \
            "$BACKEND_BUILD_CONTEXT"

      - name: Run pytest
        # MALLOC_ARENA_MAX=2 (hram FIX-6, 2026-08-07): the self-hosted netcup runner box has
        # only 7.8GB RAM shared by 3 job slots across every repo, no --memory limit on this
        # container. glibc opens a fresh per-thread malloc arena by default, inflating RSS well
        # beyond live object size for multi-threaded/forking, numpy/GDAL-heavy test suites --
        # confirmed on hram's own memory-heavy geo-build tests (live-reproduced OOM kill,
        # anon-rss ~7GB, on this exact box). Capping arenas reduces that inflation; cheap,
        # backward-compatible for every consumer of this template, no behavior/correctness change.
        run: |
          docker run --rm --network host \
            -e DJANGO_SETTINGS_MODULE='${{ inputs.django-settings-module }}' \
            -e DJANGO_SECRET_KEY='ci-dummy-secret' \
            -e DJANGO_ALLOWED_HOSTS='localhost,127.0.0.1' \
            -e DEBUG='False' \
            -e ENV_TYPE='local' \
            -e TEST_DB_HOST='localhost' \
            -e DB_HOST='localhost' \
            -e DB_PORT="${{ job.services.postgres.ports['5432'] }}" \
            -e DB_NAME='test' \
            -e DB_USER='test' \
            -e DB_PASSWORD='test' \
            -e EMAIL_PORT='25' \
            -e EMAIL_USE_TLS='False' \
            -e MALLOC_ARENA_MAX='2' \
            "$CI_IMAGE" \
            pytest --import-mode=${{ inputs.pytest-import-mode }} ${{ inputs.pytest-args }}

      - name: Remove CI image
        if: always()
        run: docker rmi -f "$CI_IMAGE" 2>/dev/null || true

  security:
    if: ${{ inputs.run-security }}
    runs-on: ${{ inputs.runs-on }}
    env:
      GITLEAKS_VERSION: '8.30.1'
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # Free OSS binary, not the gitleaks/gitleaks-action wrapper: that Action
        # now requires a paid GITLEAKS_LICENSE for GitHub organizations (breaking
        # change), which this org does not have. The gitleaks CLI itself stays free.
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"

      - name: Determine gitleaks scan range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "log_opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks (secret scan, blocking)
        # History-aware scan of exactly the incoming commit range (PR base..head,
        # or the latest commit on a manual/non-PR trigger) -- NOT the full repo
        # history (would block on pre-existing, already-known secret-shaped
        # strings) and NOT just the final working tree (misses a secret added
        # then removed within the same range, which still lands permanently in
        # merged history/blame). Auto-discovers a repo-root .gitleaks.toml.
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="${{ steps.range.outputs.log_opts }}" --redact --verbose'

      - name: pip-audit (report-only)
        shell: bash
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install pip-audit
            pip-audit -r backend/requirements.txt || echo "::warning::pip-audit findings (non-blocking v1)"
          fi
        continue-on-error: true

      - name: pnpm audit (report-only)
        shell: bash
        run: |
          if [ -f ${{ inputs.frontend-path }}/pnpm-lock.yaml ]; then
            corepack enable
            (cd ${{ inputs.frontend-path }} && pnpm audit --audit-level high) || echo "::warning::pnpm audit findings (non-blocking v1)"
          fi
        continue-on-error: true

  frontend:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4.4.0
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.frontend-path }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ inputs.frontend-path }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ inputs.run-frontend-lint }}
        working-directory: ${{ inputs.frontend-path }}
        run: pnpm lint

      - name: Test
        if: ${{ inputs.run-frontend-tests }}
        working-directory: ${{ inputs.frontend-path }}
        run: pnpm test
