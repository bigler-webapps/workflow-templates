name: App CI

on:
  workflow_call:
    inputs:
      # Backend
      dockerfile:
        type: string
        default: 'backend/Dockerfile'
      build-context:
        type: string
        default: '.'
      backend-target:
        description: >
          Optional Dockerfile build --target for the backend CI image. Default ''
          builds the full production image (current behaviour, backward-compatible).
          A repo opts in with 'backend_test' once its backend/Dockerfile splits into
          backend_base -> backend_test -> final stages (see CI-6): skips the
          frontend build + collectstatic for a pytest-only image. Only opt in after
          confirming no backend test depends on the frontend static/templates/index.html.
        type: string
        default: ''
      db-image:
        type: string
        # Must track what the fleet actually RUNS, not what it once ran.
        # Bumped 14 -> 18 on 2026-08-19 (INF-37/INF-41): twelve apps had been
        # on postgres:18 in production for a day while their tests still ran
        # against 14 -- drift that Django 6.1 merely made visible by refusing
        # PG14 outright (`PostgreSQL 15 or later is required (found 14.24)`).
        # Safe for the apps still on Django 6.0.x: fitness-monitor runs 6.0.6
        # against postgres:18 in production today, so the combination is in
        # service, not assumed. Apps needing an extension override this --
        # cockpit (pgvector) and hram (postgis) -- and their overrides must
        # track their own production images the same way.
        default: 'postgres:18'
      django-settings-module:
        type: string
        default: 'backend.test_settings'
      pytest-args:
        type: string
        default: ''
      pytest-import-mode:
        description: >
          pytest --import-mode value. Default 'importlib' avoids basename
          collisions (e.g. multiple tests.py modules). Use 'prepend' only
          if a specific repo's test layout requires it.
        type: string
        default: 'importlib'
      run-backend:
        type: boolean
        # Temporarily disabled by default to save GH Actions minutes. Callers
        # that want backend CI must opt in with `run-backend: true`. Flip back
        # to true when budget allows.
        default: false
      run-security:
        type: boolean
        default: true
      pip-audit-blocking:
        description: >
          WFT-CI-23: default false keeps today's report-only pip-audit
          (findings become a `::warning`, job stays green). true drops that
          and lets a real finding fail the `security` job.
        type: boolean
        default: false
      run-bandit:
        description: >
          WFT-CI-23: opt-in bandit static-analysis pass, off by default so no
          existing caller's `security` job changes. Scoped by `bandit-path`.
        type: boolean
        default: false
      bandit-path:
        description: >
          Reviewer R2: interpolated as a GitHub expression directly into a
          shell command, same pre-existing pattern as inputs.frontend-path
          elsewhere in this file -- a caller must keep this a static literal,
          never a dynamic expression (PR title, branch name, etc.).
          Do NOT write the brace-expression syntax literally in an input
          description: Actions evaluates expressions there, and an empty one
          is a parse error that makes this workflow unresolvable for EVERY
          caller (WM-TAKE-8 -- it took the whole fleet down for ~2h).
        type: string
        default: 'backend'
      bandit-config:
        description: >
          Optional `-c` config path for bandit (e.g. `backend/pyproject.toml`).
          Default '' runs bandit with no config file, same as a bare `bandit
          -r <bandit-path>`. Same static-literal-only caveat as bandit-path.
        type: string
        default: ''
      run-ruff:
        description: >
          WFT-CI-23: opt-in ruff lint pass in the `security` job, off by
          default. Independent of the `frontend` job's own `run-frontend-lint`.
        type: boolean
        default: false
      ruff-path:
        description: >
          Interpolated as a GitHub expression directly into a shell command
          -- same static-literal-only caveat as bandit-path.
        type: string
        default: 'backend'
      security-python-version:
        description: >
          Python version for the whole `security` job's Python tooling.
          WM-TAKE-8: this now governs pip-audit as well as bandit and ruff --
          the setup step is no longer gated on run-bandit/run-ruff, because
          pip-audit needs a Python too and silently found none on self-hosted
          runners. A caller that sets neither lint input still gets this
          Python, and its dependency audit now actually runs.
        type: string
        default: '3.12'
      run-migration-check:
        description: >
          Opt-in (cockpit MIG-2): fail CI when `manage.py makemigrations --check
          --dry-run` would produce a change, i.e. models and migration files have
          drifted apart. Default false so existing consumers are unaffected until
          they opt in; requires run-backend: true (runs against the same built
          image + Postgres service as the pytest step, not a separate build, to
          avoid flagging drift that's really just a differently-resolved CI image).
        type: boolean
        default: false
      # Frontend
      node-version:
        type: string
        default: '24'
      pnpm-version:
        type: string
        default: '10.11.0'
      frontend-path:
        type: string
        default: 'frontend'
      run-frontend-lint:
        type: boolean
        default: true
      run-frontend-tests:
        type: boolean
        # Temporarily disabled by default to save GH Actions minutes. Lint
        # stays on. Callers that want test runs must opt in with
        # `run-frontend-tests: true`. Flip back to true when budget allows.
        default: false
      runs-on:
        description: >
          Runner label. Use 'ubuntu-latest' for GitHub-hosted runners (default).
          For the self-hosted Netcup pool pass a single unique label (e.g. 'netcup').
          Multi-label JSON arrays are not supported by this input.
        type: string
        default: 'ubuntu-latest'
    secrets:
      VITE_APP_MUI_LICENSE_KEY:
        required: false
      HRAM_ENGINE_READ_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  validate-inputs:
    # MIG-2: `run-migration-check` only takes effect inside the `backend` job,
    # which is itself gated by `run-backend` (`if: ${{ inputs.run-backend }}`).
    # A caller that sets run-migration-check: true with run-backend: false would
    # otherwise get a silent no-op -- the whole job, migration check included,
    # simply doesn't run, with nothing in the UI to say why. Fail loudly instead.
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: run-migration-check requires run-backend
        if: ${{ inputs.run-migration-check && !inputs.run-backend }}
        run: |
          echo "::error::run-migration-check: true has no effect with run-backend: false -- the backend job that would run it is skipped entirely. Set run-backend: true too, or drop run-migration-check."
          exit 1

  backend:
    if: ${{ inputs.run-backend }}
    runs-on: ${{ inputs.runs-on }}
    env:
      # Unique per-run tag: the self-hosted runner's Docker daemon is shared by
      # 3 slots across ALL repos -- a fixed tag races between concurrent backend
      # jobs and executes the WRONG repo's tests.
      CI_IMAGE: ci-backend:${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: ${{ inputs.db-image }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          # Dynamic host port (NOT 5432:5432): self-hosted runners run multiple
          # jobs on ONE host, so a fixed host port collides ("port already
          # allocated"). GitHub maps a random free host port, read below via
          # job.services.postgres.ports['5432'].
          - 5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Clean stale Python byte-code
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Build backend image
        # Host-daemon BuildKit (CI-6/Grund B): the persistent self-hosted runner's
        # Docker daemon already keeps a layer cache across jobs (GC-capped via the
        # daily runner-janitor.yml -> runner_janitor.sh, INF-42), so a plain `docker build`
        # gets incremental warm builds for free. This drops setup-buildx-action's
        # docker-container driver (a separate cache namespace, not the daemon's) and
        # the remote `type=gha` cache export/import (slow, LRU-evicted under
        # multi-repo load) -- both no longer needed. `--target` stays empty by
        # default (full image, current behaviour); a repo opts into a leaner
        # pytest-only image via `backend-target: backend_test` (CI-6/Grund A).
        env:
          HRAM_ENGINE_READ_TOKEN: ${{ secrets.HRAM_ENGINE_READ_TOKEN }}
          VITE_APP_MUI_LICENSE_KEY: ${{ secrets.VITE_APP_MUI_LICENSE_KEY }}
          BACKEND_TARGET: ${{ inputs.backend-target }}
          BACKEND_DOCKERFILE: ${{ inputs.dockerfile }}
          BACKEND_BUILD_CONTEXT: ${{ inputs.build-context }}
        run: |
          set -euo pipefail
          target_args=()
          if [ -n "$BACKEND_TARGET" ]; then
            target_args=(--target "$BACKEND_TARGET")
          fi
          DOCKER_BUILDKIT=1 docker build \
            "${target_args[@]}" \
            --build-arg "VITE_APP_MUI_LICENSE_KEY=$VITE_APP_MUI_LICENSE_KEY" \
            --secret id=hram_engine_token,env=HRAM_ENGINE_READ_TOKEN \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$CI_IMAGE" \
            -f "$BACKEND_DOCKERFILE" \
            "$BACKEND_BUILD_CONTEXT"

      - name: Run pytest
        # MALLOC_ARENA_MAX=2 (hram FIX-6, 2026-08-07): the self-hosted netcup runner box has
        # only 7.8GB RAM shared by 3 job slots across every repo, no --memory limit on this
        # container. glibc opens a fresh per-thread malloc arena by default, inflating RSS well
        # beyond live object size for multi-threaded/forking, numpy/GDAL-heavy test suites --
        # confirmed on hram's own memory-heavy geo-build tests (live-reproduced OOM kill,
        # anon-rss ~7GB, on this exact box). Capping arenas reduces that inflation; cheap,
        # backward-compatible for every consumer of this template, no behavior/correctness change.
        run: |
          docker run --rm --network host \
            -e DJANGO_SETTINGS_MODULE='${{ inputs.django-settings-module }}' \
            -e DJANGO_SECRET_KEY='ci-dummy-secret' \
            -e DJANGO_ALLOWED_HOSTS='localhost,127.0.0.1' \
            -e DEBUG='False' \
            -e ENV_TYPE='local' \
            -e TEST_DB_HOST='localhost' \
            -e DB_HOST='localhost' \
            -e DB_PORT="${{ job.services.postgres.ports['5432'] }}" \
            -e DB_NAME='test' \
            -e DB_USER='test' \
            -e DB_PASSWORD='test' \
            -e EMAIL_PORT='25' \
            -e EMAIL_USE_TLS='False' \
            -e MALLOC_ARENA_MAX='2' \
            "$CI_IMAGE" \
            pytest --import-mode=${{ inputs.pytest-import-mode }} ${{ inputs.pytest-args }}

      - name: Check for missing migrations
        # MIG-2 (cockpit): catches model/migration drift (e.g. a removed field,
        # an index rename from a Django version bump) before it reaches develop.
        # Reuses the image and Postgres service the pytest step already stood up
        # -- same dependency resolution, so a flagged change is real drift, not
        # an artifact of a separately-built environment (see the input's own
        # description for why that distinction matters).
        if: ${{ inputs.run-migration-check }}
        run: |
          docker run --rm --network host \
            -e DJANGO_SETTINGS_MODULE='${{ inputs.django-settings-module }}' \
            -e DJANGO_SECRET_KEY='ci-dummy-secret' \
            -e DJANGO_ALLOWED_HOSTS='localhost,127.0.0.1' \
            -e DEBUG='False' \
            -e ENV_TYPE='local' \
            -e TEST_DB_HOST='localhost' \
            -e DB_HOST='localhost' \
            -e DB_PORT="${{ job.services.postgres.ports['5432'] }}" \
            -e DB_NAME='test' \
            -e DB_USER='test' \
            -e DB_PASSWORD='test' \
            -e EMAIL_PORT='25' \
            -e EMAIL_USE_TLS='False' \
            "$CI_IMAGE" \
            python manage.py makemigrations --check --dry-run --noinput

      - name: Remove CI image
        # WFT-CI-25: this job no longer publishes -- CI-11 moved that to
        # main.yml well before this now-redundant half was finally deleted
        # here. Only $CI_IMAGE is ever produced now, but it still must not be
        # left on the self-hosted runner's shared Docker daemon (WM-TAKE-9).
        if: always()
        run: docker image rm -f "$CI_IMAGE" 2>/dev/null || true

  security:
    if: ${{ inputs.run-security }}
    runs-on: ${{ inputs.runs-on }}
    env:
      GITLEAKS_VERSION: '8.30.1'
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # Free OSS binary, not the gitleaks/gitleaks-action wrapper: that Action
        # now requires a paid GITLEAKS_LICENSE for GitHub organizations (breaking
        # change), which this org does not have. The gitleaks CLI itself stays free.
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"

      - name: Determine gitleaks scan range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "log_opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks (secret scan, blocking)
        # History-aware scan of exactly the incoming commit range (PR base..head,
        # or the latest commit on a manual/non-PR trigger) -- NOT the full repo
        # history (would block on pre-existing, already-known secret-shaped
        # strings) and NOT just the final working tree (misses a secret added
        # then removed within the same range, which still lands permanently in
        # merged history/blame). Auto-discovers a repo-root .gitleaks.toml.
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="${{ steps.range.outputs.log_opts }}" --redact --verbose'

      - name: Set up Python for the security tooling
        # WM-TAKE-8: ungated and moved ABOVE pip-audit. It used to sit below,
        # gated on run-bandit/run-ruff, which left pip-audit resolving a bare
        # `pip` against the runner's ambient Python. On the self-hosted netcup
        # runners there is no ambient pip: the step exited 127 and every caller
        # with the default `pip-audit-blocking: false` swallowed it via
        # continue-on-error, so the dependency audit reported green while doing
        # nothing. Measured on Kira, Cinevia and Photogallery; surfaced only by
        # Gustav, whose `pip-audit-blocking: true` removed the safety net --
        # exactly the step-level failure reviewer R1 warned about in WFT-CI-23.
        # Gustav's app-local job, which this consolidation replaces, did BOTH
        # halves (setup-python, then `python -m pip`) and that is why it worked.
        # This deliberately breaks WFT-CI-23's "no caller changes behaviour"
        # criterion: on self-hosted runners the audit now runs for the FIRST
        # time and may emit warnings, and on GitHub-hosted ones it may resolve
        # a different Python minor. Preserving a silent no-op is not a value.
        uses: actions/setup-python@b64ffcaf5b410884ad320a9cfac8866006a109aa  # v5.6.0
        with:
          python-version: ${{ inputs.security-python-version }}

      - name: pip-audit (report-only)
        # WFT-CI-23: pip-audit-blocking false (default) keeps continue-on-error
        # true, exactly as before this WO -- that still covers not just the
        # audit's own findings (swallowed internally via `||`, producing the
        # same ::warning:: annotation as before) but also a hard step failure
        # unrelated to the script's exit code, e.g. `pip install pip-audit`
        # itself failing (reviewer R1 / sec_reviewer S1). true drops
        # continue-on-error so either kind of failure fails the job for real.
        shell: bash
        run: |
          if [ -f backend/requirements.txt ]; then
            python -m pip install pip-audit
            if [ "${{ inputs.pip-audit-blocking }}" = "true" ]; then
              pip-audit -r backend/requirements.txt
            else
              pip-audit -r backend/requirements.txt || echo "::warning::pip-audit findings (non-blocking v1)"
            fi
          fi
        continue-on-error: ${{ !inputs.pip-audit-blocking }}

      - name: pnpm audit (report-only)
        shell: bash
        run: |
          if [ -f ${{ inputs.frontend-path }}/pnpm-lock.yaml ]; then
            corepack enable
            (cd ${{ inputs.frontend-path }} && pnpm audit --audit-level high) || echo "::warning::pnpm audit findings (non-blocking v1)"
          fi
        continue-on-error: true

      - name: Static analysis (bandit)
        if: ${{ inputs.run-bandit }}
        shell: bash
        run: |
          python -m pip install bandit==1.9.4
          if [ -n "${{ inputs.bandit-config }}" ]; then
            bandit -q -r "${{ inputs.bandit-path }}" -c "${{ inputs.bandit-config }}"
          else
            bandit -q -r "${{ inputs.bandit-path }}"
          fi

      - name: Ruff
        if: ${{ inputs.run-ruff }}
        shell: bash
        run: |
          python -m pip install ruff==0.15.20
          ruff check "${{ inputs.ruff-path }}"

  frontend:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4.4.0
        with:
          version: ${{ inputs.pnpm-version }}
          # CI-21: this action's own default dest (~/setup-pnpm) is shared across every
          # concurrent job slot on the self-hosted runner; it unconditionally rm()s and
          # reinstalls into dest on every invocation, so two concurrent `frontend` jobs
          # racing on the shared default can delete pnpm out from under each other
          # (observed: `pnpm: command not found`, exit 127). runner.temp is per-job-slot
          # isolated on this runner (see work-orders/CI-21.md), so this removes the race.
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.frontend-path }}/pnpm-lock.yaml

      # The reusable workflow runs in the caller's checkout, so this script
      # must be checked out explicitly from workflow-templates.
      - name: Checkout workflow-templates (for i18n check)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: bigler-webapps/workflow-templates
          ref: 7f76a969c351361588a2642ee969739fab9b44aa  # CI-15 — bump deliberately when this script changes
          path: .wt-checkout

      - name: Install dependencies
        working-directory: ${{ inputs.frontend-path }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ inputs.run-frontend-lint }}
        working-directory: ${{ inputs.frontend-path }}
        run: pnpm lint

      - name: Check for duplicate i18n keys
        run: python3 .wt-checkout/.github/scripts/check_i18n_duplicate_keys.py "${{ inputs.frontend-path }}"

      - name: Test
        if: ${{ inputs.run-frontend-tests }}
        working-directory: ${{ inputs.frontend-path }}
        run: pnpm test
