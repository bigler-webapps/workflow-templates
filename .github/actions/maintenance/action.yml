name: 'Maintenance — Reboot if needed'
description: 'Installs apt updates, decides whether reboot is needed, reboots and waits for host, then checks containers.'

# v2.0.0 — Tailscale-SSH-only. ssh_private_key removed.
# Logs in as deploy with sudo -n (NOPASSWD covers apt-get + reboot via
# the biglerconsult.infra.deploy_user role sudoers config).

inputs:
  target:
    description: 'Inventory target name (used for logging)'
    required: true
  ssh_host:
    description: 'Tailnet hostname'
    required: true
  ssh_user:
    description: 'SSH user (typically deploy)'
    required: true
  apply_updates:
    description: 'Install apt updates before reboot decision'
    required: false
    default: 'true'
  force_reboot:
    description: 'Force reboot even if /var/run/reboot-required is absent'
    required: false
    default: 'false'
  expected_container_tokens_json:
    description: 'JSON-array of substrings expected in running container names after reboot'
    required: false
    default: '[]'
  recovery_contract_required:
    description: 'Whether inventory requires the installed recovery exclusion contract on this target.'
    required: false
    default: 'true'
  ts_oauth_client_id:
    description: 'Tailscale OAuth client ID. Required (v2.0.0+).'
    required: true
  ts_oauth_secret:
    description: 'Tailscale OAuth client secret.'
    required: true
  ts_tag:
    description: 'Tailnet tag for the ephemeral CI node.'
    required: false
    default: 'tag:ci-deploy'

runs:
  using: 'composite'
  steps:
    - name: Connect to tailnet
      uses: bigler-webapps/workflow-templates/.github/actions/tailnet-connect@v2.5.2
      with:
        ts_oauth_client_id: ${{ inputs.ts_oauth_client_id }}
        ts_oauth_secret: ${{ inputs.ts_oauth_secret }}
        ts_tag: ${{ inputs.ts_tag }}

    - name: Validate inputs
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_SSH_USER: ${{ inputs.ssh_user }}
        INPUT_SSH_HOST: ${{ inputs.ssh_host }}
        INPUT_RECOVERY_CONTRACT_REQUIRED: ${{ inputs.recovery_contract_required }}
        INPUT_TS_OAUTH_CLIENT_ID: ${{ inputs.ts_oauth_client_id }}
        INPUT_TS_OAUTH_SECRET: ${{ inputs.ts_oauth_secret }}
      run: |
        set -euo pipefail
        if [ -z "$INPUT_TS_OAUTH_CLIENT_ID" ] || [ -z "$INPUT_TS_OAUTH_SECRET" ]; then
          echo "❌ ts_oauth_client_id and ts_oauth_secret are required (v2.0.0+)"
          exit 1
        fi
        required_vars=(SSH_HOST SSH_USER)
        for var_name in "${required_vars[@]}"; do
          if [ -z "${!var_name}" ]; then
            echo "❌ Missing required input '${var_name}' for target '${INPUT_TARGET}'."
            exit 1
          fi
        done

        printf '%s' "$INPUT_TARGET" | grep -qE '^[a-zA-Z0-9_-]+$' || { echo "❌ Invalid 'target' input"; exit 1; }
        printf '%s' "$INPUT_SSH_USER" | grep -qE '^[a-z_][a-z0-9_-]{0,31}$' || { echo "❌ Invalid 'ssh_user' input"; exit 1; }
        printf '%s' "$INPUT_SSH_HOST" | grep -qE '^[a-zA-Z0-9._:-]+$' || { echo "❌ Invalid 'ssh_host' input"; exit 1; }
        printf '%s' "$INPUT_RECOVERY_CONTRACT_REQUIRED" | grep -qE '^(true|false)$' || { echo "Invalid recovery_contract_required input"; exit 1; }

    - name: Ship guarded maintenance adapter
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        SCRIPT_PATH: ${{ github.action_path }}/../../scripts/guarded_maintenance.py
      run: |
        set -euo pipefail
        [ -f "$SCRIPT_PATH" ] || { echo "Guarded maintenance adapter is missing."; exit 1; }
        STATUS_DIR="/var/tmp/gha-maintenance-${RUN_TOKEN}"
        ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" \
          "mkdir -p $(printf '%q' "$STATUS_DIR") && chmod 700 $(printf '%q' "$STATUS_DIR")"
        scp -o StrictHostKeyChecking=accept-new \
          "$SCRIPT_PATH" "${SSH_USER}@${SSH_HOST}:${STATUS_DIR}/guarded_maintenance.py"

    - name: 🛠️ Kick off system updates under recovery guard
      if: ${{ inputs.apply_updates == 'true' }}
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        RECOVERY_CONTRACT_REQUIRED: ${{ inputs.recovery_contract_required }}
      run: |
        set -euo pipefail
        STATUS_DIR="/var/tmp/gha-maintenance-${RUN_TOKEN}"
        {
          printf 'set -euo pipefail\n'
          printf 'STATUS_DIR=%q\n' "$STATUS_DIR"
          printf 'REQUIRED=%q\n' "$RECOVERY_CONTRACT_REQUIRED"
          printf 'SCRIPT="$STATUS_DIR/guarded_maintenance.py"\n'
          printf 'rm -f "$STATUS_DIR/done" "$STATUS_DIR/exit_code" "$STATUS_DIR/log"\n'
          printf 'setsid nohup bash -c %q guarded-maintenance "$SCRIPT" "$REQUIRED" "$STATUS_DIR" > "$STATUS_DIR/log" 2>&1 < /dev/null &\n' \
            'set +e; python3 "$1" apt --contract-required "$2"; rc=$?; echo "$rc" > "$3/exit_code"; touch "$3/done"'
          printf 'disown\n'
        } | ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" bash -s
        echo "Upgrade started in the background with destination recovery admission held by the adapter."
    - name: ⏳ Wait for system updates to finish
      if: ${{ inputs.apply_updates == 'true' }}
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -euo pipefail
        STATUS_DIR="/var/tmp/gha-maintenance-${RUN_TOKEN}"

        echo "Waiting for the remote apt upgrade to finish..."
        DONE="no"
        for i in $(seq 1 60); do
          if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 "${SSH_USER}@${SSH_HOST}" "test -f '${STATUS_DIR}/done'" 2>/dev/null; then
            DONE="yes"
            break
          fi
          sleep 10
        done

        if [ "$DONE" != "yes" ]; then
          # Do not clean up STATUS_DIR here: the detached run.sh may still be
          # legitimately mid-upgrade on a slow box. Deleting it now would not
          # stop that process but would make its later log/exit_code/done
          # writes fail silently, destroying the only postmortem evidence for
          # a genuinely stuck run.
          echo "::error::Remote apt upgrade did not finish within timeout."
          exit 1
        fi

        echo "--- remote apt log ---"
        ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" "cat '${STATUS_DIR}/log'" || true
        echo "--- end log ---"

        EXIT_CODE="$(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" "cat '${STATUS_DIR}/exit_code'")"
        echo "Remote apt upgrade exit code: ${EXIT_CODE}"

        ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" "rm -f '${STATUS_DIR}/log' '${STATUS_DIR}/exit_code' '${STATUS_DIR}/done'" || true

        if [ "$EXIT_CODE" != "0" ]; then
          echo "::error::Remote apt upgrade failed with exit code ${EXIT_CODE}."
          exit 1
        fi

    - name: 🤔 Decide whether reboot is needed
      id: decision
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        FORCE_REBOOT: ${{ inputs.force_reboot }}
      run: |
        set -euo pipefail

        NEED_REBOOT="no"
        REASON="none"

        if [ "$FORCE_REBOOT" = "true" ]; then
          NEED_REBOOT="yes"
          REASON="forced"
        elif ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" "test -f /var/run/reboot-required"; then
          NEED_REBOOT="yes"
          REASON="reboot-required"
        fi

        echo "need_reboot=$NEED_REBOOT" >> "$GITHUB_OUTPUT"
        echo "reason=$REASON" >> "$GITHUB_OUTPUT"

        if [ "$NEED_REBOOT" = "yes" ]; then
          BOOT_ID_BEFORE="$(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" "cat /proc/sys/kernel/random/boot_id")"
          printf '%s' "$BOOT_ID_BEFORE" | grep -qE '^[a-f0-9-]{36}$' || { echo "Invalid host boot identity."; exit 1; }
          echo "boot_id_before=$BOOT_ID_BEFORE" >> "$GITHUB_OUTPUT"
        fi

        echo "Decision: need_reboot=$NEED_REBOOT (reason=$REASON)"
        # Informational only — the decision above is already final, so a
        # transient connection drop here (e.g. a sshd restart from the prior
        # apt upgrade) must not fail this step.
        ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" "uname -a; uptime" || true

    - name: ⏭️ Skip reboot
      if: steps.decision.outputs.need_reboot != 'yes'
      shell: bash
      run: echo "No reboot required. Finishing maintenance run."

    - name: 🔁 Trigger reboot
      if: steps.decision.outputs.need_reboot == 'yes'
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        RECOVERY_CONTRACT_REQUIRED: ${{ inputs.recovery_contract_required }}
      run: |
        set -euo pipefail
        STATUS_DIR="/var/tmp/gha-maintenance-${RUN_TOKEN}"
        {
          printf 'set -euo pipefail\n'
          printf 'STATUS_DIR=%q\n' "$STATUS_DIR"
          printf 'SCRIPT="$STATUS_DIR/guarded_maintenance.py"\n'
          printf 'REQUIRED=%q\n' "$RECOVERY_CONTRACT_REQUIRED"
          printf 'rm -f "$STATUS_DIR/guard-acquired" "$STATUS_DIR/reboot-requested" "$STATUS_DIR/reboot-failed" "$STATUS_DIR/reboot.log"\n'
          printf 'setsid nohup python3 "$SCRIPT" reboot --contract-required "$REQUIRED" --status-dir "$STATUS_DIR" > "$STATUS_DIR/reboot.log" 2>&1 < /dev/null &\n'
          printf 'echo $! > "$STATUS_DIR/reboot.pid"\n'
        } | ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" bash -s

        TRANSPORT_UNKNOWN=false
        REQUESTED=false
        for i in $(seq 1 30); do
          if RESULT="$(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 "${SSH_USER}@${SSH_HOST}" \
            "if [ -f '${STATUS_DIR}/reboot-failed' ]; then echo failed; elif [ -f '${STATUS_DIR}/reboot-requested' ]; then echo requested; else echo pending; fi" 2>/dev/null)"; then
            case "$RESULT" in
              requested) REQUESTED=true; break ;;
              failed) echo "Guarded reboot was refused or failed."; exit 1 ;;
            esac
          else
            SSH_RC=$?
            if [ "$SSH_RC" -eq 255 ]; then
              TRANSPORT_UNKNOWN=true
              break
            fi
            exit "$SSH_RC"
          fi
          sleep 1
        done
        if [ "$REQUESTED" = false ] && [ "$TRANSPORT_UNKNOWN" = false ]; then
          echo "Guarded reboot adapter did not record an accepted reboot request."
          exit 1
        fi
        echo "Reboot request marker confirmed; post-reconnect checks must prove the host rebooted."

    - name: ⏳ Wait for host to come back
      if: steps.decision.outputs.need_reboot == 'yes'
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
      run: |
        set -euo pipefail
        # Tailscale-SSH reconnect: after reboot, tailscaled comes back up,
        # the node re-advertises in the tailnet, and plain ssh (auth=none)
        # works again. Magic-DNS resolution stays cached at the runner.
        echo "Waiting for SSH to become reachable again..."
        sleep 15

        for i in $(seq 1 60); do
          if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 "${SSH_USER}@${SSH_HOST}" "echo online" >/dev/null 2>&1; then
            echo "Host is reachable again."
            exit 0
          fi
          sleep 10
        done

        echo "::error::Host did not come back within timeout."
        exit 1

    - name: 🔍 Post-check containers
      if: steps.decision.outputs.need_reboot == 'yes'
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        BOOT_ID_BEFORE: ${{ steps.decision.outputs.boot_id_before }}
        RECOVERY_CONTRACT_REQUIRED: ${{ inputs.recovery_contract_required }}
        EXPECTED_CONTAINER_TOKENS_JSON: ${{ inputs.expected_container_tokens_json }}
      run: |
        set -euo pipefail

        STATUS_DIR="/var/tmp/gha-maintenance-${RUN_TOKEN}"
        RECOVERY_STATUS="$(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" \
          "if [ -f '${STATUS_DIR}/reboot-failed' ]; then echo failed; elif [ -f '${STATUS_DIR}/reboot-requested' ]; then echo requested; else echo missing; fi")"
        [ "$RECOVERY_STATUS" = "requested" ] || { echo "Guarded reboot status is '$RECOVERY_STATUS'."; exit 1; }
        BOOT_ID_AFTER="$(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" "cat /proc/sys/kernel/random/boot_id")"
        [ -n "$BOOT_ID_BEFORE" ] && [ "$BOOT_ID_AFTER" != "$BOOT_ID_BEFORE" ] || { echo "Host boot identity did not change; reboot is unverified."; exit 1; }
        ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" \
          "python3 '${STATUS_DIR}/guarded_maintenance.py' verify-reboot --contract-required '${RECOVERY_CONTRACT_REQUIRED}'"

        ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" "uptime"
        echo

        echo "Running containers:"
        ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" 'docker ps --format "table {{.Names}}\t{{.Status}}"'
        echo

        CONTAINER_NAMES="$(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" 'docker ps --format "{{.Names}}"')"
        export CONTAINER_NAMES

        python3 - <<'PYCODE'
        import json
        import os

        names = os.environ.get("CONTAINER_NAMES", "").splitlines()
        expected = json.loads(os.environ.get("EXPECTED_CONTAINER_TOKENS_JSON", "[]"))
        missing = [token for token in expected if not any(token in name for name in names)]
        if missing:
            print("Missing expected container token(s):", ", ".join(missing))
            raise SystemExit(1)

        print("All expected app/infrastructure container groups are present.")
        PYCODE
