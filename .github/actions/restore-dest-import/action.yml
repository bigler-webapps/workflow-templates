name: 'Cross-server restore — destination-side import'
description: >-
  Downloads the encrypted dump produced by restore-source-export, ships it to
  the destination host, decrypts it there with a passphrase deterministically
  derived from the pre-shared transport key, and imports it into the dest
  app database via the recovery transaction. Always deletes the
  GitHub Artifact at the end (success or failure).

# v2.0.0 — Tailscale-SSH-only. ssh_private_key removed.

inputs:
  dest_target:
    description: 'Inventory target name of the destination (used for logging + work-dir naming).'
    required: true
  app_name:
    description: 'App name (e.g. innoservice). Must match ^[a-zA-Z0-9_-]+$.'
    required: true
  dest_subtarget:
    description: 'Destination compose env (e.g. staging, production). Selects which {app}_{env} compose project on the dest host receives the dump.'
    required: true
  auto_restart:
    description: 'If "true", transaction finalization starts the intended app stack after verified recovery. Default false leaves it stopped.'
    required: false
    default: 'false'
  recovery_source:
    description: 'Trusted inventory identity of the source host, used to associate and reconcile this recovery.'
    required: true
  ssh_host:
    description: 'Tailnet hostname of destination'
    required: true
  ssh_user:
    description: 'Destination host SSH user.'
    required: true
  artifact_name:
    description: 'Artifact name produced by restore-source-export.'
    required: true
  transport_key:
    description: 'Pre-shared transport key (must match the value passed to restore-source-export). Used together with the run identifier to derive the decryption passphrase.'
    required: true
  ops_scripts_path:
    description: 'Local path containing webapp-ops-scripts checkout (must contain restore.py).'
    required: false
    default: 'ops-scripts'
  github_token:
    description: 'Token used to delete the handoff artifact at the end. Caller should pass secrets.GITHUB_TOKEN.'
    required: true
  ts_oauth_client_id:
    description: 'Tailscale OAuth client ID. Required (v2.0.0+).'
    required: true
  ts_oauth_secret:
    description: 'Tailscale OAuth client secret.'
    required: true
  ts_tag:
    description: 'Tailnet tag for the ephemeral CI node.'
    required: false
    default: 'tag:ci-deploy'

runs:
  using: 'composite'
  steps:
    - name: Connect to tailnet
      uses: bigler-webapps/workflow-templates/.github/actions/tailnet-connect@v2.5.2
      with:
        ts_oauth_client_id: ${{ inputs.ts_oauth_client_id }}
        ts_oauth_secret: ${{ inputs.ts_oauth_secret }}
        ts_tag: ${{ inputs.ts_tag }}

    - name: 🔎 Validate inputs
      shell: bash
      env:
        INPUT_DEST_TARGET: ${{ inputs.dest_target }}
        INPUT_APP_NAME: ${{ inputs.app_name }}
        INPUT_DEST_SUBTARGET: ${{ inputs.dest_subtarget }}
        INPUT_RECOVERY_SOURCE: ${{ inputs.recovery_source }}
        INPUT_SSH_USER: ${{ inputs.ssh_user }}
        INPUT_SSH_HOST: ${{ inputs.ssh_host }}
        INPUT_AUTO_RESTART: ${{ inputs.auto_restart }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        TRANSPORT_KEY: ${{ inputs.transport_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_TS_OAUTH_CLIENT_ID: ${{ inputs.ts_oauth_client_id }}
        INPUT_TS_OAUTH_SECRET: ${{ inputs.ts_oauth_secret }}
      run: |
        set -euo pipefail
        if [ -z "$INPUT_TS_OAUTH_CLIENT_ID" ] || [ -z "$INPUT_TS_OAUTH_SECRET" ]; then
          echo "❌ ts_oauth_client_id and ts_oauth_secret are required (v2.0.0+)"
          exit 1
        fi
        required_vars=(INPUT_SSH_HOST INPUT_SSH_USER INPUT_APP_NAME INPUT_DEST_SUBTARGET INPUT_DEST_TARGET ARTIFACT_NAME TRANSPORT_KEY GITHUB_TOKEN)
        for var_name in "${required_vars[@]}"; do
          if [ -z "${!var_name}" ]; then
            echo "❌ Missing required input '${var_name}'."
            exit 1
          fi
        done

        printf '%s' "$INPUT_DEST_TARGET" | grep -qE '^[a-zA-Z0-9_-]+$' || { echo "❌ Invalid 'dest_target' input"; exit 1; }
        printf '%s' "$INPUT_APP_NAME" | grep -qE '^[a-zA-Z0-9_-]+$' || { echo "❌ Invalid 'app_name' input"; exit 1; }
        printf '%s' "$INPUT_DEST_SUBTARGET" | grep -qE '^[a-zA-Z0-9_-]+$' || { echo "❌ Invalid 'dest_subtarget' input"; exit 1; }
        printf '%s' "$INPUT_SSH_USER" | grep -qE '^[a-z_][a-z0-9_-]{0,31}$' || { echo "❌ Invalid 'ssh_user' input"; exit 1; }
        printf '%s' "$INPUT_SSH_HOST" | grep -qE '^[a-zA-Z0-9._:-]+$' || { echo "❌ Invalid 'ssh_host' input"; exit 1; }
        printf '%s' "$INPUT_AUTO_RESTART" | grep -qE '^(true|false)$' || { echo "❌ Invalid 'auto_restart' input (must be true/false)"; exit 1; }
        printf '%s' "$INPUT_RECOVERY_SOURCE" | grep -qE '^[a-zA-Z0-9_-]+$' || { echo "❌ Invalid 'recovery_source' input"; exit 1; }

    - name: 🧮 Compute work-dir
      id: compute_names
      shell: bash
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        APP_NAME: ${{ inputs.app_name }}
        DEST_TARGET: ${{ inputs.dest_target }}
        DEST_SUBTARGET: ${{ inputs.dest_subtarget }}
        RECOVERY_SOURCE: ${{ inputs.recovery_source }}
      run: |
        set -euo pipefail
        WORK_TAG="restore-import-${RUN_ID}-${RUN_ATTEMPT}-${APP_NAME}"
        echo "work_tag=${WORK_TAG}" >> "$GITHUB_OUTPUT"
        IDENTITY_HASH="$(printf '%s\0%s\0%s\0%s\0%s\0%s' "$RUN_ID" "$RUN_ATTEMPT" "$APP_NAME" "$DEST_TARGET" "$DEST_SUBTARGET" "$RECOVERY_SOURCE" | sha256sum | awk '{print $1}')"
        echo "operation_id=github-${RUN_ID}-${RUN_ATTEMPT}-${IDENTITY_HASH}" >> "$GITHUB_OUTPUT"

    - name: 🔐 Derive run-scoped passphrase from transport key
      shell: bash
      env:
        TRANSPORT_KEY: ${{ inputs.transport_key }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        # Must use the same derivation formula as restore-source-export.
        PASSPHRASE="$(printf '%s:%s:%s' "$TRANSPORT_KEY" "$RUN_ID" "$RUN_ATTEMPT" | sha256sum | awk '{print $1}')"
        echo "::add-mask::${PASSPHRASE}"
        echo "PASSPHRASE=${PASSPHRASE}" >> "$GITHUB_ENV"

    - name: 📂 Ship restore.py to dest host work-dir
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        OPS_SCRIPTS_PATH: ${{ inputs.ops_scripts_path }}
        WORK_TAG: ${{ steps.compute_names.outputs.work_tag }}
      run: |
        set -euo pipefail

        if [ ! -d "${OPS_SCRIPTS_PATH}" ]; then
          echo "❌ ops_scripts_path '${OPS_SCRIPTS_PATH}' not found."
          exit 1
        fi
        if [ ! -f "${OPS_SCRIPTS_PATH}/restore.py" ]; then
          echo "❌ ${OPS_SCRIPTS_PATH}/restore.py missing — webapp-ops-scripts checkout failed?"
          exit 1
        fi
        if [ ! -f "${OPS_SCRIPTS_PATH}/stack_recovery.py" ]; then
          echo "${OPS_SCRIPTS_PATH}/stack_recovery.py missing; recovery contract is required."
          exit 1
        fi

        # Stage restore.py inside the per-run work dir (mode 700, user-writable
        # /tmp/<work_tag>/). Avoids needing root/sudo to write into
        # /srv/infrastructure/ops-scripts/ on hosts where the deploy user is
        # not privileged there (e.g. the staging host).
        ssh -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
          "WORK_TAG=$(printf '%q' "$WORK_TAG") \
           bash -s" <<'EOF'
        set -euo pipefail
        WORK_DIR="/tmp/${WORK_TAG}"
        rm -rf "$WORK_DIR"
        mkdir -p "$WORK_DIR"
        chmod 700 "$WORK_DIR"
        EOF
        scp -o StrictHostKeyChecking=accept-new \
          "${OPS_SCRIPTS_PATH}/restore.py" \
          "${OPS_SCRIPTS_PATH}/stack_recovery.py" \
          "${SSH_USER}@${SSH_HOST}:/tmp/${WORK_TAG}/"

    - name: 📥 Download encrypted artifact
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
      with:
        name: ${{ inputs.artifact_name }}
        path: ./xrestore-handoff/

    - name: ⬆️ Upload encrypted dump to dest host
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        WORK_TAG: ${{ steps.compute_names.outputs.work_tag }}
      run: |
        set -euo pipefail
        ls -la ./xrestore-handoff/
        scp -o StrictHostKeyChecking=accept-new \
          ./xrestore-handoff/dump.tar.enc \
          "${SSH_USER}@${SSH_HOST}:/tmp/${WORK_TAG}/dump.tar.enc"

    - name: 🔓 Decrypt + untar on dest host
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        WORK_TAG: ${{ steps.compute_names.outputs.work_tag }}
        PASSPHRASE: ${{ env.PASSPHRASE }}
      run: |
        set -euo pipefail
        ssh -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
          "WORK_TAG=$(printf '%q' "$WORK_TAG") \
           ENC_PASS=$(printf '%q' "$PASSPHRASE") \
           bash -s" <<'EOF'
        set -euo pipefail
        WORK_DIR="/tmp/${WORK_TAG}"
        openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENC_PASS \
          -in "${WORK_DIR}/dump.tar.enc" \
          | tar -C "$WORK_DIR" -xf -
        rm -f "${WORK_DIR}/dump.tar.enc"
        chmod 600 "${WORK_DIR}/dump.sql.gz" "${WORK_DIR}/manifest.json"

        if ! EXPECTED_SHA256="$(jq -er '.dump_sha256 | select(type == "string" and test("^[0-9a-fA-F]{64}$")) | ascii_downcase' "${WORK_DIR}/manifest.json")"; then
          echo "❌ dump integrity check failed: manifest has no valid dump_sha256" >&2
          exit 1
        fi
        if ! EXPECTED_SIZE="$(jq -er '.dump_size_bytes | select(type == "number" and floor == . and . >= 0) | tostring' "${WORK_DIR}/manifest.json")"; then
          echo "❌ dump integrity check failed: manifest has no valid dump_size_bytes" >&2
          exit 1
        fi

        ACTUAL_SHA256="$(sha256sum "${WORK_DIR}/dump.sql.gz" | awk '{print $1}')"
        ACTUAL_SIZE="$(stat -c%s "${WORK_DIR}/dump.sql.gz")"
        if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ] || [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
          echo "❌ dump integrity check failed: expected sha256=${EXPECTED_SHA256} size=${EXPECTED_SIZE}, got sha256=${ACTUAL_SHA256} size=${ACTUAL_SIZE}" >&2
          exit 1
        fi
        ls -la "$WORK_DIR"
        EOF

    - name: 🔄 Run restore.py --mode import-only on dest host
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        WORK_TAG: ${{ steps.compute_names.outputs.work_tag }}
        APP_NAME: ${{ inputs.app_name }}
        RECOVERY_SOURCE: ${{ inputs.recovery_source }}
        DEST_SUBTARGET: ${{ inputs.dest_subtarget }}
        AUTO_RESTART: ${{ inputs.auto_restart }}
        RECOVERY_OPERATION_ID: ${{ steps.compute_names.outputs.operation_id }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        ssh -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
          "WORK_TAG=$(printf '%q' "$WORK_TAG") \
           APP_NAME=$(printf '%q' "$APP_NAME") \
           RECOVERY_SOURCE=$(printf '%q' "$RECOVERY_SOURCE") \
           DEST_SUBTARGET=$(printf '%q' "$DEST_SUBTARGET") \
           AUTO_RESTART=$(printf '%q' "$AUTO_RESTART") \
           RECOVERY_OPERATION_ID=$(printf '%q' "$RECOVERY_OPERATION_ID") \
           RUN_ID=$(printf '%q' "$RUN_ID") \
           RUN_ATTEMPT=$(printf '%q' "$RUN_ATTEMPT") \
           bash -s" <<'EOF'
        set -euo pipefail
        export PATH=$PATH:/usr/local/bin
        WORK_DIR="/tmp/${WORK_TAG}"
        RECOVERY_ARGS=(
          --operation-id "$RECOVERY_OPERATION_ID"
          --recovery-source "$RECOVERY_SOURCE"
          --origin-run-id "$RUN_ID"
          --origin-attempt "$RUN_ATTEMPT"
        )
        if [ "$AUTO_RESTART" = "true" ]; then
          RECOVERY_ARGS+=(--auto-restart)
        fi
        python3 "${WORK_DIR}/restore.py" \
          --mode import-only \
          --app "$APP_NAME" \
          --target-env "$DEST_SUBTARGET" \
          --dump-file "${WORK_DIR}/dump.sql.gz" \
          "${RECOVERY_ARGS[@]}"
        EOF

    - name: 🧹 Cleanup dest host work-dir
      if: always()
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        WORK_TAG: ${{ steps.compute_names.outputs.work_tag }}
      run: |
        set -euo pipefail
        ssh -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" \
          "WORK_TAG=$(printf '%q' "$WORK_TAG") \
           bash -s" <<'EOF' || true
        set -euo pipefail
        rm -rf "/tmp/${WORK_TAG}"
        EOF
        rm -rf ./xrestore-handoff

    - name: 🗑️ Delete handoff artifact (always)
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        # Listing artifacts needs `actions: read` (default). Deleting needs
        # `actions: write` — the caller job must declare it explicitly, otherwise
        # this step degrades gracefully (artifact expires via retention).
        if ! LIST_JSON="$(gh api -X GET "/repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" 2>&1)"; then
          echo "⚠️ Failed to list artifacts (likely missing actions:read/write on GITHUB_TOKEN). Artifact will expire via retention."
          echo "    API response: ${LIST_JSON}"
          exit 0
        fi
        ARTIFACT_ID="$(printf '%s' "$LIST_JSON" | jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name==$name) | .id' | head -n1)"
        if [ -n "${ARTIFACT_ID:-}" ] && [ "$ARTIFACT_ID" != "null" ]; then
          echo "Deleting handoff artifact id=${ARTIFACT_ID} name=${ARTIFACT_NAME}"
          gh api -X DELETE "/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" || echo "⚠️ Artifact delete failed (will expire via retention)."
        else
          echo "ℹ️ Artifact '${ARTIFACT_NAME}' not found via API — nothing to delete (will expire via retention)."
        fi
