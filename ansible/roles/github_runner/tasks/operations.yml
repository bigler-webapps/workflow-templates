---
# Dedicated low-privilege operations runner profile. The caller validates all
# inventory values before including this file; no CI profile task is included.
- name: Assert operations profile is isolated and explicitly eligible
  ansible.builtin.assert:
    that:
      - github_runner_profile == 'operations'
      - inventory_hostname == 'ops'
      - "'operations' in group_names and 'runners' not in group_names"
      - github_runner_operations_repository == 'bigler-webapps-ops/webapp-operations'
      - github_runner_operations_slots is integer and github_runner_operations_slots == 1
      - github_runner_user not in [github_runner_operations_user, github_runner_operations_issuer_user, github_runner_operations_poller_user]
      - github_runner_base_dir != github_runner_operations_base_dir
      - github_runner_operations_user == 'gh-operations'
      - github_runner_operations_issuer_user == 'gh-runner-issuer'
      - github_runner_operations_poller_user == 'gh-operations-poller'
      - github_runner_operations_base_dir == '/opt/gh-operations'
      - github_runner_operations_runtime_dir == '/var/lib/gh-operations'
      - github_runner_operations_issuer_client == '/usr/local/libexec/wm-sec18/issue-runner-jit'
      - github_runner_operations_active is boolean
      - github_runner_operations_runner_sha256 is match('^sha256:[0-9a-f]{64}$')
      - github_runner_operations_runner_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - github_runner_operations_packages is sequence and github_runner_operations_packages is not string
      - github_runner_operations_packages | length > 0
      - github_runner_operations_packages | unique | list | length == github_runner_operations_packages | length
      - "['git', 'openssh-client', 'rsync', 'python3', 'curl', 'jq'] | difference(github_runner_operations_packages) | length == 0"
      - github_runner_operations_packages | reject('match', '^(git|openssh-client|rsync|python3|curl|jq|ca-certificates|tzdata|libc6|libgcc-s1|libstdc\+\+6|zlib1g|libicu[0-9]+|libssl[0-9]+(t64)?|libkrb5-3|libgssapi-krb5-2|liblttng-ust[0-9]+(t64)?|libunwind[0-9]+|libcurl[34](t64)?)$') | list | length == 0
      - not (github_runner_app_id | string | length > 0)
      - not (github_runner_app_private_key | string | length > 0)
      - not (github_runner_app_installation_id | string | length > 0)
      - github_runner_group_id | string == '1'
      - github_runner_slots is integer and github_runner_slots == 1
      - github_runner_operations_max_job_seconds is integer and 0 < github_runner_operations_max_job_seconds <= 3600
      - github_runner_operations_state_size_bytes is integer and 0 < github_runner_operations_state_size_bytes <= 536870912
    fail_msg: >-
      Operations profile requires a separate one-slot ops identity, the exact
      private repository, only allowlisted distro packages, no CI App credentials,
      and a real boolean activation selector. Activation requires the separate
      run-time evidence gate below; committed inventory values cannot satisfy it.

- name: Require operator approval for operations runner activation
  ansible.builtin.assert:
    that:
      - github_runner_operations_activation_authorized is sameas true
    fail_msg: >-
      Operations runner activation refused: github_runner_operations_activation_authorized must be the operator's
      run-time approval supplied as a JSON boolean.
  when: github_runner_operations_active is sameas true

- name: Require operations runner containment statement for activation
  ansible.builtin.assert:
    that:
      - github_runner_operations_containment_verified is sameas true
    fail_msg: >-
      Operations runner activation refused: github_runner_operations_containment_verified must state that P2b was
      re-read and the credentials directory is placed as required in W2.
  when: github_runner_operations_active is sameas true

- name: Require verified operations issuer client statement for activation
  ansible.builtin.assert:
    that:
      - github_runner_operations_issuer_client_verified is sameas true
    fail_msg: >-
      Operations runner activation refused: github_runner_operations_issuer_client_verified must be the operator's
      run-time statement that the issuer client was verified.
  when: github_runner_operations_active is sameas true

- name: Require pinned operations issuer client digest for activation
  ansible.builtin.assert:
    that:
      - github_runner_operations_issuer_client_sha256 | string is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Operations runner activation refused: github_runner_operations_issuer_client_sha256 must contain the known
      pinned SHA256 digest.
  when: github_runner_operations_active is sameas true

- name: Inspect operations service state before provisioning
  ansible.builtin.service_facts:

# Disabled as well as stopped: a reboot during the rest of the apply must not start the runner again while its files
# and unit are being changed. The activation block below enables and starts it once every precondition holds.
- name: Stop the operations runner with explicit drain approval
  become: true
  ansible.builtin.systemd:
    name: gh-operations.service
    enabled: false
    state: stopped
  when:
    - github_runner_operations_drain_approved is sameas true
    - ansible_facts.services.get('gh-operations.service', {}).get('state', 'stopped') == 'running'

- name: Refresh operations service state after approved drain
  ansible.builtin.service_facts:

- name: Refuse changes to an active operations slot
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get('gh-operations.service', {}).get('state', 'stopped') != 'running'
    fail_msg: Drain and verify the operations slot through its separately approved lifecycle before provisioning.

- name: Inspect existing operations account memberships
  become: true
  ansible.builtin.getent:
    database: group

- name: Reject pre-existing privileged operations accounts
  ansible.builtin.assert:
    that:
      - item not in (getent_group.get('docker', ['','','',''])[2] | default('') | split(','))
      - item not in (getent_group.get('sudo', ['','','',''])[2] | default('') | split(','))
      - item not in (getent_group.get('wheel', ['','','',''])[2] | default('') | split(','))
    fail_msg: Never repurpose an existing privileged CI identity as operations.
  loop:
    - "{{ github_runner_operations_user }}"
    - "{{ github_runner_operations_issuer_user }}"
    - "{{ github_runner_operations_poller_user }}"

- name: Inspect existing numeric service identities
  ansible.builtin.getent:
    database: passwd

- name: Reject aliased or privileged pre-existing service groups
  ansible.builtin.assert:
    that:
      - item not in getent_group or getent_group[item][1] | int > 0
      - item not in getent_group or getent_group[item][1] not in _operations_other_gids
    fail_msg: Service groups must have distinct non-root GIDs unrelated to other local groups.
  vars:
    _operations_other_gids: "{{ getent_group | dict2items | rejectattr('key', 'equalto', item) | map(attribute='value') | map(attribute=1) | list }}"
  loop:
    - "{{ github_runner_operations_user }}"
    - "{{ github_runner_operations_issuer_user }}"
    - "{{ github_runner_operations_poller_user }}"

- name: Reject root or shared pre-existing service identities
  ansible.builtin.assert:
    that:
      - item not in getent_passwd or getent_passwd[item][1] | int > 0
      - item not in getent_passwd or getent_passwd[item][1] not in _operations_other_uids
      - item not in getent_passwd or getent_passwd[item][2] not in _operations_privileged_gids
    fail_msg: Operations, issuer and poller must have distinct non-root UIDs unrelated to CI.
  vars:
    _operations_other_uids: "{{ getent_passwd | dict2items | rejectattr('key', 'equalto', item) | map(attribute='value') | map(attribute=1) | list }}"
    _operations_privileged_gids: "{{ ['docker', 'sudo', 'wheel'] | intersect(getent_group.keys() | list) | map('extract', getent_group) | map(attribute=1) | list }}"
  loop:
    - "{{ github_runner_operations_user }}"
    - "{{ github_runner_operations_issuer_user }}"
    - "{{ github_runner_operations_poller_user }}"

- name: Ensure separate operations service groups exist
  become: true
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop:
    - "{{ github_runner_operations_user }}"
    - "{{ github_runner_operations_issuer_user }}"
    - "{{ github_runner_operations_poller_user }}"

- name: Ensure operations service identities exist without privileged groups
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    group: "{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ github_runner_operations_runtime_dir }}/{{ item }}"
    create_home: false
    groups: []
    append: false
    state: present
  loop:
    - "{{ github_runner_operations_user }}"
    - "{{ github_runner_operations_issuer_user }}"
    - "{{ github_runner_operations_poller_user }}"

# Under --check the identities above are only simulated, so on a fresh host the account does not exist yet and a
# real read would fail. A real run still fails when the account is missing (fail_key).
- name: Read operations numeric service identity for private state mount
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_runner_operations_user }}"
    fail_key: "{{ not ansible_check_mode }}"

- name: Report where the check run of the operations profile stops on a host without its service identities
  ansible.builtin.debug:
    msg: >-
      Check mode: the operations service identities do not exist on this host yet, so everything after their
      creation (directories, units, packages, runner) cannot be simulated truthfully and is not checked here.
      A real run creates them.
  when:
    - ansible_check_mode
    - getent_passwd.get(github_runner_operations_user) is none

- name: End the check run for this host where it cannot continue truthfully
  ansible.builtin.meta: end_host
  when:
    - ansible_check_mode
    - getent_passwd.get(github_runner_operations_user) is none

- name: Create protected operations directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ github_runner_operations_base_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ github_runner_operations_base_dir }}/runner", owner: root, group: root, mode: "0755" }
    - { path: "{{ github_runner_operations_base_dir }}/bin", owner: root, group: root, mode: "0755" }
    - { path: "{{ github_runner_operations_base_dir }}/cache", owner: root, group: root, mode: "0755" }
    - { path: "{{ github_runner_operations_runtime_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ github_runner_operations_runtime_dir }}/slot", owner: root, group: root, mode: "0755" }
    - { path: "{{ github_runner_operations_runtime_dir }}/issuer", owner: "{{ github_runner_operations_issuer_user }}", group: "{{ github_runner_operations_issuer_user }}", mode: "0700" }
    - { path: "{{ github_runner_operations_runtime_dir }}/poller", owner: "{{ github_runner_operations_poller_user }}", group: "{{ github_runner_operations_poller_user }}", mode: "0700" }

# Packages come from the host's configured, signed Ubuntu archive only: no repository or key is added anywhere in this
# role. `present`, not `latest`: a run never upgrades what is already installed; security updates arrive through the
# operating system's own update path, and what is installed is recorded below on every run.
- name: Deny third-party apt origins for the operations runtime package names
  become: true
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (github_runner operations profile). The operations runtime packages come from the Ubuntu
      # archive only: a repository added for another purpose (the Tailscale one) must never supply them.
      {% for origin in github_runner_operations_denied_apt_origins %}
      Package: {{ github_runner_operations_packages | join(' ') }}
      Pin: origin {{ origin }}
      Pin-Priority: -1

      {% endfor %}
    dest: /etc/apt/preferences.d/gh-operations-archive-only.pref
    owner: root
    group: root
    mode: "0644"

- name: Install operations runtime packages from the configured Ubuntu archive
  become: true
  ansible.builtin.apt:
    name: "{{ github_runner_operations_packages }}"
    state: present
    update_cache: true

- name: Read the installed operations runtime package versions
  ansible.builtin.package_facts:
    manager: apt

- name: Show the installed operations runtime package versions
  ansible.builtin.debug:
    msg: "{{ github_runner_operations_package_manifest.splitlines() }}"

# Skipped under --check: on a fresh host the parent directory only exists after a real run.
- name: Record the operations runtime package manifest
  become: true
  ansible.builtin.copy:
    content: "{{ github_runner_operations_package_manifest }}\n"
    dest: "{{ github_runner_operations_base_dir }}/package-manifest.txt"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Download pinned operations runner archive
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ github_runner_operations_runner_version }}/actions-runner-linux-x64-{{ github_runner_operations_runner_version }}.tar.gz"
    dest: "{{ github_runner_operations_base_dir }}/cache/runner.tar.gz"
    checksum: "{{ github_runner_operations_runner_sha256 }}"
    mode: "0644"

- name: Extract immutable operations runner installation
  become: true
  ansible.builtin.unarchive:
    src: "{{ github_runner_operations_base_dir }}/cache/runner.tar.gz"
    dest: "{{ github_runner_operations_base_dir }}/runner"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Deploy fixed operations runner launcher
  become: true
  ansible.builtin.template:
    src: operations-launcher.sh.j2
    dest: "{{ github_runner_operations_base_dir }}/bin/launch.sh"
    owner: root
    group: root
    mode: "0755"

- name: Deploy inactive operations systemd service
  become: true
  ansible.builtin.template:
    src: gh-operations.service.j2
    dest: /etc/systemd/system/gh-operations.service
    owner: root
    group: root
    mode: "0644"
  notify: systemd daemon-reload

- name: Flush operations service unit handler
  ansible.builtin.meta: flush_handlers

- name: Keep operations runner disabled by default
  become: true
  ansible.builtin.systemd:
    name: gh-operations.service
    enabled: false
    state: stopped
  when: github_runner_operations_active is sameas false

- name: Read the runner issuer socket state before the operations runner starts
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-active
      - ops-runner-issuer.socket
  register: _operations_issuer_socket
  changed_when: false
  failed_when: false
  when:
    - github_runner_operations_active is sameas true
    - not ansible_check_mode

- name: Require the runner issuer socket to be active before the operations runner starts
  ansible.builtin.assert:
    that:
      - _operations_issuer_socket.stdout | trim == 'active'
    fail_msg: "Operations runner activation refused: the runner issuer socket on ops is not active."
  when:
    - github_runner_operations_active is sameas true
    - not ansible_check_mode

- name: Inspect the pinned runner issuer client before the operations runner starts
  ansible.builtin.stat:
    path: "{{ github_runner_operations_issuer_client }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: _operations_issuer_client_stat
  when:
    - github_runner_operations_active is sameas true
    - not ansible_check_mode

- name: Require the runner issuer client to match its pinned digest
  ansible.builtin.assert:
    that:
      - _operations_issuer_client_stat.stat.exists
      - _operations_issuer_client_stat.stat.isreg
      - _operations_issuer_client_stat.stat.pw_name == 'root'
      - _operations_issuer_client_stat.stat.checksum == github_runner_operations_issuer_client_sha256
    fail_msg: >-
      Operations runner activation refused: the issuer client must be a root-owned regular file whose SHA256 matches
      github_runner_operations_issuer_client_sha256.
  when:
    - github_runner_operations_active is sameas true
    - not ansible_check_mode

- name: Inspect the unpacked runner before the operations runner starts
  ansible.builtin.stat:
    path: "{{ github_runner_operations_base_dir }}/runner/bin/Runner.Listener"
    follow: false
  register: _operations_runner_stat
  when:
    - github_runner_operations_active is sameas true
    - not ansible_check_mode

- name: Require the unpacked runner to be present
  ansible.builtin.assert:
    that:
      - _operations_runner_stat.stat.exists
      - _operations_runner_stat.stat.isreg
    fail_msg: "Operations runner activation refused: the pinned runner archive is not unpacked."
  when:
    - github_runner_operations_active is sameas true
    - not ansible_check_mode

- name: Start the operations runner through the activation gate
  become: true
  ansible.builtin.systemd:
    name: gh-operations.service
    enabled: true
    state: started
  when: github_runner_operations_active is sameas true

