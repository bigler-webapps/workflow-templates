---
# Validate the profile before including either profile's mutating tasks.
- name: Assert runner profile selection is supported
  ansible.builtin.assert:
    that:
      - github_runner_profile != 'ci' or inventory_hostname != 'ops'
      - github_runner_profile != 'ci' or 'operations' not in group_names
      - github_runner_profile in ['ci', 'operations']
      - github_runner_profile != 'operations' or (github_runner_operations_repository == 'bigler-webapps/webapp-operations')
      - github_runner_profile != 'operations' or (github_runner_operations_slots is integer and github_runner_operations_slots == 1)
      - github_runner_profile != 'operations' or (github_runner_slots is integer and github_runner_slots == 1)
      - github_runner_profile != 'operations' or (github_runner_group_id | string == '1')
      - github_runner_profile != 'operations' or (github_runner_user not in [github_runner_operations_user, github_runner_operations_issuer_user, github_runner_operations_poller_user])
      - github_runner_profile != 'operations' or (github_runner_operations_base_dir != github_runner_base_dir)
      - github_runner_profile != 'operations' or (github_runner_app_id | string | length == 0)
      - github_runner_profile != 'operations' or (github_runner_app_private_key | string | length == 0)
      - github_runner_profile != 'operations' or (github_runner_app_installation_id | string | length == 0)
    fail_msg: >-
      Unsupported runner profile or unsafe operations profile combination.
      Operations requires the dedicated one-slot repository identity and no
      CI App credentials; use the CI profile for existing runner hosts.
      The CI profile cannot target the ops host or operations inventory group.

- name: Apply existing CI runner profile
  ansible.builtin.include_tasks: ci.yml
  when: github_runner_profile == 'ci'

- name: Apply isolated operations runner profile
  ansible.builtin.include_tasks: operations.yml
  when: github_runner_profile == 'operations'
