---
# github_runner role — defaults
#
# Required host_vars (populated via sync-secrets, never hardcoded):
#   github_runner_app_id              — GitHub App numeric ID
#   github_runner_app_private_key     — Full PEM content (use YAML block scalar |)
#   github_runner_app_installation_id — Installation ID for the bigler-webapps org
#
# github_runner_sha256:
#   SHA256 of the linux-x64 tarball for the pinned version.
#   Find it at: https://github.com/actions/runner/releases
#   Format: "sha256:<hexdigest>"
#   Always update github_runner_version and github_runner_sha256 together.
#
# github_runner_slots:
#   Number of concurrent ephemeral runner instances on this host.
#   Each slot gets its own isolated copy of the runner dir and a dedicated
#   systemd service unit (gh-runner@1.service, gh-runner@2.service, …).
#   Each unit self-registers a fresh ephemeral runner before every job pickup.
#
# github_runner_group_id:
#   Numeric ID of the GitHub org runner group (1 = Default group).
#   Find it: org Settings → Actions → Runner groups → note the ID in the URL.
#
# OPERATIONAL NOTE — App registration:
#   This role uses a GitHub App (not a PAT) to obtain ephemeral runner tokens
#   via the generate-jitconfig API. The App must be installed on the org and
#   granted "Self-hosted runners: write" permission. The installation ID lives
#   in the App install URL (Settings → GitHub Apps → <name> → Installation).

github_runner_org: bigler-webapps

# How the CI profile obtains its JIT configuration (WM-SEC-18 C2).
#   local  — jit-config.sh holds the GitHub App key on this host and calls the API itself (default; the
#            App variables below are required).
#   issuer — this host holds NO GitHub credential: ci-issue-jit asks the CI runner issuer on the ops host,
#            which derives name, group and labels from its own policy. The App variables are not used and
#            app.pem is removed. Switch only inside the transition window, after the issuer is active and a
#            canary has passed: with the issuer unreachable every slot stops registering, so the switch
#            needs the explicit `github_runner_issuer_ready: true`.
github_runner_jit_broker: local
github_runner_issuer_ready: false
# Issuer endpoint on the ops tailnet address (IP literal) and this host's caller identity.
github_runner_issuer_host: ""
github_runner_issuer_port: 9444
github_runner_issuer_caller: ""
# The caller's HMAC key ([A-Za-z0-9._~+/=-], 32 to 128 characters, at least ten distinct), delivered by
# sync-secrets, never committed.
github_runner_issuer_key: ""

# Select the existing CI profile unless an inventory explicitly opts into the
# isolated operations profile. This scaffolding never enables its service.
github_runner_profile: ci
github_runner_operations_repository: bigler-webapps-ops/webapp-operations
github_runner_operations_slots: 1
github_runner_operations_active: false
# Always bump version and checksum together; the checksum is the linux-x64 line of the actions/runner release body.
github_runner_operations_runner_version: "2.338.2"
github_runner_operations_runner_sha256: "sha256:baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40"
github_runner_operations_user: gh-operations
github_runner_operations_base_dir: /opt/gh-operations
github_runner_operations_runtime_dir: /var/lib/gh-operations
github_runner_operations_issuer_user: gh-runner-issuer
github_runner_operations_poller_user: gh-operations-poller
github_runner_operations_issuer_client: /usr/local/libexec/wm-sec18/issue-runner-jit
github_runner_operations_issuer_client_sha256: ""
github_runner_operations_max_job_seconds: 3600
# All writable job/configuration/diagnostic/temp data shares this capped,
# service-private tmpfs; it disappears on stop, including after SIGKILL.
github_runner_operations_state_size_bytes: 268435456
# Distro packages of the operations runtime, installed `state: present` from the Ubuntu archive (the role adds no
# repository and no key; the Tailscale origin is denied for these names, see github_runner_operations_denied_apt_origins). There are NO exact version pins: the archive keeps only the
# newest version of a package, so an exact pin breaks on the next Ubuntu security update (WM-SEC-18, 2026-11-06). The
# versions actually installed are recorded on every run (a root-owned manifest and the run output). The list is
# bounded by an allowlist in tasks/operations.yml: Docker, Node/npm or arbitrary tools cannot be added.
github_runner_operations_packages:
  - git
  - openssh-client
  - rsync
  - python3
  - curl
  - jq
  - ca-certificates
  - tzdata
  - libc6
  - libgcc-s1
  - libstdc++6
  - zlib1g
  - libicu74
  - libssl3t64
  - libkrb5-3
  - libgssapi-krb5-2
  - liblttng-ust1t64
  - libunwind8
  - libcurl4t64
# Third-party apt origins that must never supply the packages above (an apt preference with priority -1, for exactly
# those package names). The operations host also carries the signed Tailscale repository, added by the tailscale
# role; without this a higher version of a same-named package there would win.
github_runner_operations_denied_apt_origins:
  - pkgs.tailscale.com
# Evidence of the installed versions, rendered lazily from the package facts read after the install (a name that is
# not installed, as under --check on a fresh host, shows `not-installed`).
github_runner_operations_package_manifest: "{% set ns = namespace(lines=['# Installed by Ansible from the configured Ubuntu archive. Evidence of what is installed, not a pin.']) %}{% for name in github_runner_operations_packages | sort %}{% set ns.lines = ns.lines + [name ~ ' ' ~ (ansible_facts.packages.get(name, [{'version': 'not-installed'}]) | first).version] %}{% endfor %}{{ ns.lines | join('\n') }}"

# GitHub App credentials — REQUIRED, set via host_vars / sync-secrets
github_runner_app_id: ""
github_runner_app_private_key: ""
github_runner_app_installation_id: ""

# Runner binary — pin both version and checksum together
# Latest releases: https://github.com/actions/runner/releases
github_runner_version: "2.321.0"
# Fill in the SHA256 of the linux-x64 tarball for github_runner_version.
# Find it at: https://github.com/actions/runner/releases  Format: sha256:<hex>
github_runner_sha256: ""

# GitHub CLI — the apt repository normally publishes only the current release;
# this installation method cannot reliably pin a specific version. This value
# records the last known version and should be reviewed when this role changes.
github_runner_gh_version: "2.63.0"

# Exact routine CLI authority is shipped inside this collection role.
# Override drift is refused by the CI profile before provisioning.
github_runner_routine_cli_contract: "{{ lookup('ansible.builtin.file', role_path + '/files/routine-cli.json') | from_json }}"
github_runner_node_major: "{{ github_runner_routine_cli_contract.node_major }}"
github_runner_claude_code_version: "{{ github_runner_routine_cli_contract.version }}"

# @openai/codex npm package version - empty leaves the runner unchanged;
# set to a concrete version (for example "0.161.0") to install Codex CLI.
github_runner_codex_version: ""

# System account and base path
github_runner_user: gh-runner
github_runner_base_dir: /opt/gh-runner

# Number of parallel ephemeral runner slots on this host
github_runner_slots: 3

# Slots intentionally retired from this host are excluded from all slot-wide
# runner operations, including draining.
github_runner_retired_slots: []

# github_runner_restart_sec:
#   INF-43 (2026-08-20): the fixed 30s this replaces dated from the role's
#   original commit, before jit-config.sh's stale-same-name-runner delete
#   (step 2b) started handling the HTTP 409 registration race structurally.
#   Measured cost: median inter-job gap on a loaded slot was 37s, ~= this
#   value + the JWT/token/delete/register round-trips. A moderate value,
#   not the smallest possible one: the stale-delete only removes a
#   registration GitHub reports as NOT busy, so a persistent 409 is still
#   possible, and StartLimitIntervalSec=0 means there is no start-limit
#   brake on how often it retries against the GitHub API.
github_runner_restart_sec: 5

# Org runner group ID (1 = Default)
github_runner_group_id: 1

# Labels applied to all slots (comma-separated, no spaces around commas)
github_runner_labels: "self-hosted,netcup"

# Optional extra labels by slot number (integer key); each comma-separated
# value is appended only to that slot's registration. Empty preserves the
# registration labels for every slot exactly as before.
github_runner_slot_extra_labels: {}
