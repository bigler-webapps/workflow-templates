---
- name: Install Tailscale (requires root)
  become: true
  block:
    - name: Ensure Tailscale keyring directory exists
      ansible.builtin.file:
        path: "{{ tailscale_apt_keyring_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Tailscale GPG key
      ansible.builtin.get_url:
        url: "{{ tailscale_apt_repo_url }}/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: "{{ tailscale_apt_keyring_path }}"
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Add Tailscale apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by={{ tailscale_apt_keyring_path }}]
          {{ tailscale_apt_repo_url }}
          {{ ansible_distribution_release }} main
        filename: "{{ tailscale_apt_repo_filename }}"
        state: present
        update_cache: true

    # update_cache here defends against stale apt caches when this role
    # runs stand-alone (without the base role having refreshed caches).
    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Ensure tailscaled service started and enabled
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true

    # Idempotency: skip `tailscale up` when the daemon is already
    # `Running`. CAVEAT: this does not detect declared-vs-live drift for
    # tags, hostname, or routes — set tailscale_force_up=true (one run)
    # after changing those vars to force a re-up. See defaults.
    - name: Check current Tailscale backend state
      ansible.builtin.command: tailscale status --json
      register: _tailscale_status
      changed_when: false
      failed_when: false

    - name: Parse Tailscale backend state
      ansible.builtin.set_fact:
        _tailscale_backend_state: >-
          {{ (_tailscale_status.stdout | from_json).BackendState
             if (_tailscale_status.rc == 0 and (_tailscale_status.stdout | length) > 0)
             else 'NoState' }}

    # SECURITY NOTE: argv carries the auth-key. `no_log: true` suppresses
    # standard task output, but third-party callback plugins (ARA,
    # custom log shippers) may capture argv from internal task data
    # before no_log applies. Vet new callbacks for this exposure.
    #
    # `--reset` ensures the live flag set exactly matches the declared
    # variables — no left-over flags from a previous `tailscale up`.
    - name: Bring Tailscale up
      ansible.builtin.command:
        argv: >-
          {{
            ['tailscale', 'up', '--reset',
             '--authkey=' ~ tailscale_authkey,
             '--hostname=' ~ tailscale_hostname,
             '--ssh=' ~ (tailscale_ssh | string | lower),
             '--accept-routes=' ~ (tailscale_accept_routes | string | lower)]
            + (['--netfilter-mode=' ~ tailscale_netfilter_mode] if tailscale_netfilter_mode | length > 0 else [])
            + (['--accept-dns=' ~ tailscale_accept_dns] if tailscale_accept_dns | length > 0 else [])
            + (['--advertise-tags=' ~ (tailscale_advertise_tags | join(','))] if tailscale_advertise_tags else [])
            + (['--advertise-routes=' ~ (tailscale_advertise_routes | join(','))] if tailscale_advertise_routes else [])
          }}
      when:
        - tailscale_authkey | length > 0
        - (_tailscale_backend_state != 'Running') or (tailscale_force_up | bool)
      no_log: true
      changed_when: true

    - name: Read Tailscale preferences before enforcing runner settings
      ansible.builtin.command:
        argv: >-
          {{ ['tailscale', 'debug', 'prefs'] }}
      register: _tailscale_prefs
      changed_when: false
      failed_when: false
      when: tailscale_netfilter_mode | length > 0 or tailscale_accept_dns | length > 0 or tailscale_auto_update | length > 0

    - name: Parse Tailscale preferences
      ansible.builtin.set_fact:
        _tailscale_prefs_json: "{{ _tailscale_prefs.stdout | from_json }}"
      when:
        - not ansible_check_mode
        - tailscale_netfilter_mode | length > 0 or tailscale_accept_dns | length > 0 or tailscale_auto_update | length > 0
        - _tailscale_prefs.rc == 0

    - name: Apply declared Tailscale preferences
      ansible.builtin.command:
        argv: >-
          {{ ['tailscale', 'set']
                 + (['--netfilter-mode=' ~ tailscale_netfilter_mode] if tailscale_netfilter_mode | length > 0 else [])
                 + (['--accept-dns=' ~ tailscale_accept_dns] if tailscale_accept_dns | length > 0 else [])
                 + (['--auto-update=' ~ tailscale_auto_update] if tailscale_auto_update | length > 0 else []) }}
      when:
        - not ansible_check_mode
        - tailscale_netfilter_mode | length > 0 or tailscale_accept_dns | length > 0 or tailscale_auto_update | length > 0
        - >-
          _tailscale_prefs.rc != 0 or not (
          (tailscale_netfilter_mode | length == 0 or (_tailscale_prefs_json.NetfilterMode | default('') | string | lower) in tailscale_netfilter_mode_aliases[tailscale_netfilter_mode]) and
          (tailscale_accept_dns | length == 0 or (_tailscale_prefs_json.CorpDNS | default(false) | string | lower) == tailscale_accept_dns) and
          (tailscale_auto_update | length == 0 or (((_tailscale_prefs_json.AutoUpdate | default({})).Apply if (_tailscale_prefs_json.AutoUpdate | default({})) is mapping else _tailscale_prefs_json.AutoUpdate | default('')) | default('') | string | lower) == tailscale_auto_update))
      changed_when: true

    - name: Read Tailscale preferences after enforcement
      ansible.builtin.command:
        argv: >-
          {{ ['tailscale', 'debug', 'prefs'] }}
      register: _tailscale_prefs_post
      changed_when: false
      when:
        - not ansible_check_mode
        - tailscale_netfilter_mode | length > 0 or tailscale_accept_dns | length > 0 or tailscale_auto_update | length > 0

    - name: Parse Tailscale preferences after enforcement
      ansible.builtin.set_fact:
        _tailscale_prefs_post_json: "{{ _tailscale_prefs_post.stdout | from_json }}"
      when:
        - not ansible_check_mode
        - tailscale_netfilter_mode | length > 0 or tailscale_accept_dns | length > 0 or tailscale_auto_update | length > 0

    - name: Report raw Tailscale preference values
      ansible.builtin.debug:
        msg: "NetfilterMode={{ _tailscale_prefs_post_json.NetfilterMode | default('?') }} CorpDNS={{ _tailscale_prefs_post_json.CorpDNS | default('?') }} AutoUpdate={{ _tailscale_prefs_post_json.AutoUpdate | default('?') }}"
      when:
        - not ansible_check_mode
        - tailscale_netfilter_mode | length > 0 or tailscale_accept_dns | length > 0 or tailscale_auto_update | length > 0

    - name: Assert Tailscale preferences
      ansible.builtin.assert:
        that:
          - (tailscale_netfilter_mode | length == 0 or (_tailscale_prefs_post_json.NetfilterMode | default('') | string | lower) in tailscale_netfilter_mode_aliases[tailscale_netfilter_mode])
          - (tailscale_accept_dns | length == 0 or (_tailscale_prefs_post_json.CorpDNS | default(false) | string | lower) == tailscale_accept_dns)
          - (tailscale_auto_update | length == 0 or (((_tailscale_prefs_post_json.AutoUpdate | default({})).Apply if (_tailscale_prefs_post_json.AutoUpdate | default({})) is mapping else _tailscale_prefs_post_json.AutoUpdate | default('')) | default('') | string | lower) == tailscale_auto_update)
      when:
        - not ansible_check_mode
        - tailscale_netfilter_mode | length > 0 or tailscale_accept_dns | length > 0 or tailscale_auto_update | length > 0

    - name: Re-check Tailscale state after up
      ansible.builtin.command: tailscale status --json
      register: _tailscale_status_post
      changed_when: false
      failed_when: false
      when: tailscale_authkey | length > 0

    - name: Assert Tailscale daemon responded with valid JSON
      ansible.builtin.assert:
        that:
          - _tailscale_status_post.rc == 0
          - (_tailscale_status_post.stdout | length) > 0
        fail_msg: >-
          Tailscale daemon did not respond to status query after up
          (rc={{ _tailscale_status_post.rc }}).
      when: tailscale_authkey | length > 0 and not ansible_check_mode

    - name: Assert Tailscale BackendState is Running
      ansible.builtin.assert:
        that:
          - (_tailscale_status_post.stdout | from_json).BackendState == 'Running'
        fail_msg: >-
          Tailscale BackendState is
          {{ (_tailscale_status_post.stdout | from_json).BackendState }},
          expected Running.
      when: tailscale_authkey | length > 0 and not ansible_check_mode
