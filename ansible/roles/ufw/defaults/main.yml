---
ufw_default_policy_input: deny
ufw_default_policy_output: allow
# ufw module vocabulary: allow|deny|reject. For the FORWARD chain
# `allow` maps to ACCEPT in /etc/default/ufw (needed by Docker for
# container NAT). The lineinfile task below performs that mapping.
ufw_default_policy_forward: allow

# Default-allowed inbound ports. SSH only by default.
#
# NOTE: This is intentionally narrower than the legacy provision-server
# composite, which also opened 80/tcp and 443/tcp. The web stack is not
# in scope of this collection — the consumer is responsible for adding
# web-stack ports (override or extend ufw_allow_in in the tenant
# playbook) when deploying Traefik or similar.
#
# Tightening (e.g. binding SSH to a VPN interface) is also the
# consumer's decision and is not implemented here.
ufw_allow_in:
  - port: "22"
    proto: tcp
    comment: ssh

ufw_enabled: true
ufw_logging: low

# When true: reset UFW to empty state then rebuild from ufw_allow_in.
# Provides full desired-state reconciliation. Off by default.
ufw_managed_inbound_exclusive: false

# Docker-published ports are DNATed before reaching the host INPUT chain, so
# ordinary UFW inbound rules cannot restrict them. Opt in to a dedicated
# DOCKER-USER chain for internet-facing Docker web ports when a consumer
# publishes them on this host. Update the Cloudflare lists from
# https://www.cloudflare.com/ips-v4/ and https://www.cloudflare.com/ips-v6/
# in this one place. To roll back, disable ufw_docker_user_web_restrict and
# run this role; the unit stop path removes its jump and chain. Manually,
# `iptables -D DOCKER-USER -j DOCKER-USER-WEB` removes the IPv4 jump.
ufw_docker_user_web_restrict: false
ufw_docker_user_web_ports:
  - 80
  - 443
ufw_docker_user_external_interface: "{{ ansible_default_ipv4.interface | default('', true) }}"
ufw_docker_user_cloudflare_ipv4:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
ufw_docker_user_cloudflare_ipv6:
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
ufw_docker_user_tailnet_ipv4: "100.64.0.0/10"
ufw_docker_user_chain: DOCKER-USER-WEB
